[project]
name = "py-noita"
version = "0.1.0"
description = "Python adaptation of Noita with a new theme."
readme = "README.md"
authors = [
    { name = "Daniel Rösch", email = "droesch91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "pygame-ce>=2.5.8",
    "pymunk>=7.3.0",
]

[project.scripts]
py-noita = "py_noita:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
